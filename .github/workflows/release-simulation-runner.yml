# Release the simulation-runner (hosted-runner) image — fully automatic.
#
# Why it is separate from release-images.yml:
#   1. it is FROM the EE overlay (future-agi-ee), not the OSS base;
#   2. it bundles the published ALK SDK (`fi[livekit]`) into /opt/alk-venv;
#   3. it publishes to Google Artifact Registry (GAR), not Docker Hub.
#
# Ordering: the sim-runner is FROM future-agi-ee:<version>, so it can only build
# AFTER the EE image for that version exists. release-images.yml dispatches
# `platform-release` to the ee repo; the ee repo, once it has published
# future-agi-ee:<version>, dispatches `ee-image-published` back here (the
# symmetric companion change). No human input on the release path — everything
# is derived from the version. workflow_dispatch(version) exists ONLY as a
# manual retry.
name: release-simulation-runner

on:
  repository_dispatch:
    types: [ee-image-published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Manual retry only — image tag, e.g. v1.38.0'
        required: true
        type: string

permissions:
  contents: read

env:
  GAR_LOCATION: us-central1
  GAR_REPO: futureagi
  IMAGE_NAME: future-agi-simulation-runner
  EE_IMAGE: futureagi/future-agi-ee
  # Native LiveKit stack pin — see Dockerfile.simulation-runner. Pinned here so
  # the build stays deterministic with no input.
  LIVEKIT_AGENTS_VERSION: '1.5.17'

concurrency:
  group: release-simulation-runner-${{ github.event.client_payload.version || inputs.version }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - name: Resolve & validate version
        id: v
        env:
          # repository_dispatch payload on the release path; input on manual retry.
          RAW_VERSION: ${{ github.event.client_payload.version || inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          # Whole-string bash regex. Unlike a multi-line `grep -Eq`, `[[ =~ ]]`
          # with ^...$ cannot match a payload that smuggles a newline, so a
          # crafted client_payload.version can't inject a second `version=` line
          # into GITHUB_OUTPUT and hijack the checkout ref / push tag.
          if [[ ! "$RAW_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]; then
            echo "::error::version '$RAW_VERSION' must match vX.Y.Z[-suffix]"; exit 1
          fi
          echo "version=$RAW_VERSION" >> "$GITHUB_OUTPUT"
          # FI_VERSION tracks the platform tag: the ALK SDK is cut in lockstep
          # with the hosted-runner release (see Dockerfile.simulation-runner),
          # and the versioned job schema fails fast on any mismatch.
          echo "fi_version=${RAW_VERSION#v}" >> "$GITHUB_OUTPUT"

      - name: Verify the ALK SDK version is published on PyPI
        run: |
          set -euo pipefail
          v="${{ steps.v.outputs.fi_version }}"
          curl -fsS -o /dev/null "https://pypi.org/pypi/agent-learning-kit/${v}/json" \
            || { echo "::error::agent-learning-kit==${v} is not on PyPI yet — the SDK must be published before the ee repo dispatches ee-image-published"; exit 1; }

      - name: Free up disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # main as of 2026-07-23
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false
          swap-storage: false

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.v.outputs.version }}
          submodules: false

      # Pull the EE base image from Docker Hub.
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Auth to GCP + configure Docker to push to Artifact Registry.
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${GAR_LOCATION}-docker.pkg.dev" --quiet

      - uses: docker/setup-buildx-action@v3

      - name: Build & push simulation-runner
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.simulation-runner
          platforms: linux/amd64
          push: true
          provenance: false
          build-args: |
            BACKEND_IMAGE=${{ env.EE_IMAGE }}:${{ steps.v.outputs.version }}
            FI_VERSION=${{ steps.v.outputs.fi_version }}
            LIVEKIT_AGENTS_VERSION=${{ env.LIVEKIT_AGENTS_VERSION }}
          tags: ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.GAR_REPO }}/${{ env.IMAGE_NAME }}:${{ steps.v.outputs.version }}
          cache-from: type=gha,scope=simulation-runner
          cache-to: type=gha,scope=simulation-runner,mode=max

  # Bump the sim-runner image tag in the deployment repo (Helm values), mirroring
  # release-images.yml's bump-deployment. Skip-if-missing so a region not yet
  # wired for the hosted runner doesn't fail the release.
  bump-deployment:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERSION: ${{ needs.build.outputs.version }}
      SIMRUNNER_VALUES: >-
        eu/gcp/deployment/temporal-worker/simulation-runner-values.yaml
        us/gcp/deployment/temporal-worker/simulation-runner-values.yaml
      TAG_PATH: .temporal_worker.image.tag
    steps:
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          owner: future-agi
          repositories: deployment
          # Least privilege: this job only pushes a branch and opens a PR.
          permission-contents: write
          permission-pull-requests: write
      - name: Checkout deployment repo
        uses: actions/checkout@v4
        with:
          repository: future-agi/deployment
          token: ${{ steps.app-token.outputs.token }}
          ref: main
      - name: Install yq
        run: sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64 && sudo chmod +x /usr/local/bin/yq
      - name: Bump simulation-runner tag (skip regions not yet wired)
        run: |
          set -eu
          bumped=0
          # $SIMRUNNER_VALUES is intentionally unquoted so it word-splits into
          # one path per region (same pattern as release-images.yml).
          # shellcheck disable=SC2086
          for f in $SIMRUNNER_VALUES; do
            if [ ! -f "$f" ]; then
              echo "::warning::$f not present yet — skipping (region not wired for the hosted runner)"
              continue
            fi
            if [ "$(yq "$TAG_PATH" "$f")" = "null" ]; then
              echo "::error::$TAG_PATH missing in $f — values schema drifted; refusing a partial bump that would silently leave this region on the old image"
              exit 1
            fi
            yq -i "$TAG_PATH = \"${VERSION}\"" "$f"
            bumped=$((bumped + 1))
          done
          [ "$bumped" -gt 0 ] || { echo "::error::no simulation-runner values file could be bumped — wire the deployment repo first"; exit 1; }
      - name: Open bump PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -eu
          branch="chore/bump-simulation-runner-${VERSION}"
          git config user.name "futureagi-release-bot"
          git config user.email "release-bot@futureagi.com"
          git switch -c "$branch" 2>/dev/null || git switch "$branch"
          git add -A
          git diff --cached --quiet && { echo "values already at ${VERSION}; nothing to do"; exit 0; }
          git commit -m "chore(release): bump simulation-runner image to ${VERSION}"
          # Plain --force (not --force-with-lease): this branch is bot-owned and
          # regenerated deterministically from main on every run, and a
          # single-branch checkout never fetches its remote ref — so a lease has
          # no base to compare against and is rejected as "stale info" on any
          # re-run/retry. Nothing human ever pushes here to clobber.
          git push --force -u origin "$branch"
          if [ -z "$(gh pr list --repo future-agi/deployment --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr create --repo future-agi/deployment --base main --head "$branch" \
              --title "chore(release): bump simulation-runner to ${VERSION}" \
              --body "Automated bump of the hosted simulation-runner image to [${VERSION}](https://github.com/future-agi/future-agi/releases/tag/${VERSION})."
          else
            echo "bump PR already open"
          fi
